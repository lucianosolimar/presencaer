<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presença no ER São José do Rio Preto – Feira do Empreendedor</title>
<style>
:root{--ink:#13263b;--bg:#eef2f6;--card:#fff;--mut:#5b6e80;--line:#d5dee7;--m:#1b63b8;--t:#d98a1f;--ok:#e8f1fb;--tk:#fdf1de}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 24px}
h1{margin:0;font-size:22px;font-weight:600}
header p{margin:4px 0 0;color:#b9c8d8}
main{max-width:1280px;margin:0 auto;padding:18px 16px 40px}
.resumo{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.res{background:var(--card);border-radius:6px;padding:10px 12px;border-bottom:4px solid var(--m)}
.res.zero{border-color:#c4566b}
.res b{display:block;font-size:15px}
.res span{color:var(--mut);font-size:13px}
.dias{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
.dia{background:var(--card);border-radius:6px;overflow:hidden}
.dia h2{margin:0;padding:12px 14px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line)}
.dia h2 small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.per{padding:10px 14px 12px}
.per h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.per h3 i{font-style:normal;font-size:12px;border-radius:10px;padding:1px 9px;color:#fff;background:var(--m)}
.per.t{background:var(--tk)}.per.t h3 i{background:var(--t)}
.per.m{background:var(--ok)}
ul{margin:0;padding:0;list-style:none}
li{padding:3px 0;border-top:1px solid rgba(19,38,59,.1);font-size:14px}
li:first-child{border-top:0}
li em{font-style:normal;color:var(--mut);font-size:12px}
.vazio{color:#a33a4f;font-size:14px}
.ausentes{margin-top:18px;background:var(--card);border-radius:6px;padding:14px 16px}
.ausentes h2{margin:0 0 6px;font-size:15px}
.ausentes p{margin:0;color:var(--mut)}
@media(max-width:1000px){.resumo,.dias{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.resumo,.dias{grid-template-columns:1fr}}
@media print{header{background:#fff;color:#000}.dias{grid-template-columns:repeat(5,1fr)}}
.tag{font-size:11px;background:#1b63b8;color:#fff;border-radius:8px;padding:0 7px;margin-left:6px;vertical-align:1px}
li.ef{font-weight:600}
.leg{margin:0 0 14px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Presença no ER São José do Rio Preto</h1>
  <p>Feira do Empreendedor · de 19 a 23 de outubro · quem estará presencialmente, por dia e período</p>
</header>
<main>
  <p class="leg"><span class="tag" style="margin:0">efetivo</span> = funcionário efetivo · sem etiqueta = estagiário</p>
  <section class="resumo" id="resumo"></section>
  <section class="dias" id="dias"></section>
  <section class="ausentes" id="aus"></section>
</main>
<script>
const D={"dias": [{"dia": "19", "nome": "Segunda-feira", "manha": ["Bianca", "Cauã", "Cristiane", "Dayane", "Felipe", "Flavia", "Jennifer", "Larissa", "Lidiane", "Nayara", "Rebeca", "Ricardo", "Simone", "Thiago", "Wagner"], "tarde": ["Cauã", "Cristiane", "Dayane", "Felipe", "Flavia", "Jennifer", "João", "Larissa", "Lidiane", "Nayara", "Rebeca", "Simone", "Thiago", "Wagner"]}, {"dia": "20", "nome": "Terça-feira", "manha": ["Bianca", "Cauã", "Dayane", "Felipe", "Jennifer", "João", "Larissa", "Thiago", "Wagner"], "tarde": ["Cauã", "Dayane", "Felipe", "Jennifer", "João", "Larissa", "Thiago", "Wagner"]}, {"dia": "21", "nome": "Quarta-feira", "manha": ["Cauã", "Dayane", "Jennifer", "João", "Larissa", "Rebeca"], "tarde": ["Cauã", "Dayane", "Jennifer", "João", "Julio", "Larissa", "Rebeca"]}, {"dia": "22", "nome": "Quinta-feira", "manha": ["Bianca", "Cauã", "Felipe", "Jennifer", "João", "Julio", "Larissa", "Rebeca", "Thiago", "Wagner"], "tarde": ["Cauã", "Felipe", "Jennifer", "João", "Julio", "Larissa", "Mario", "Rebeca", "Thiago", "Wagner"]}, {"dia": "23", "nome": "Sexta-feira", "manha": ["Bianca", "Cauã", "Dayane", "Felipe", "Jennifer", "Julio", "Larissa", "Rebeca", "Thiago", "Wagner"], "tarde": ["Cauã", "Dayane", "Felipe", "Jennifer", "Julio", "Larissa", "Rebeca", "Thiago", "Wagner"]}], "ausentes": ["Artur", "G. Mendes", "G. Prato", "Juan", "Luciano", "Sabrina", "Valeria", "Victor"], "total": 26};
const EF=new Set(['Bianca','Cristiane','Flavia','Lidiane','Nayara','Ricardo','Simone','João','Julio','Wagner','Mario']);
const ord=a=>[...a.filter(n=>EF.has(n)),...a.filter(n=>!EF.has(n))];
const lista=(a)=>a.length?`<ul>${ord(a).map(n=>EF.has(n)?`<li class="ef">${n}<span class="tag">efetivo</span></li>`:`<li>${n}</li>`).join('')}</ul>`:'<div class="vazio">Ninguém presencial</div>';
const per=(c,t,a)=>`<div class="per ${c}"><h3>${t}<i>${a.length}</i></h3>${lista(a)}</div>`;
document.getElementById('resumo').innerHTML=D.dias.map(d=>{
  const s=[...new Set([...d.manha,...d.tarde])];const u=s.length,ne=s.filter(n=>EF.has(n)).length;
  const vz=!d.manha.length||!d.tarde.length;
  return `<div class="res${vz?' zero':''}"><b>${d.nome.split('-')[0]}, ${d.dia}/10</b><span>${u} pessoa${u===1?'':'s'} (${ne} efetivos, ${u-ne} estag.) · manhã ${d.manha.length} · tarde ${d.tarde.length}</span></div>`}).join('');
document.getElementById('dias').innerHTML=D.dias.map(d=>`<article class="dia"><h2>${d.nome}<small>${d.dia}/10</small></h2>${per('m','Manhã',d.manha)}${per('t','Tarde',d.tarde)}</article>`).join('');
document.getElementById('aus').innerHTML=`<h2>Responderam que não estarão presencialmente (${D.ausentes.length} de ${D.total})</h2><p>${D.ausentes.join(' · ')}</p>`;
</script>
</body>
</html>
